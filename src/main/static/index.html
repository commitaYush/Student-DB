<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System (JavaBean + JDBC)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        header h1 { font-size: 1.8rem; color: #38bdf8; }
        header p { color: #94a3b8; font-size: 0.95rem; }
        
        .grid { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; }
        .card { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 1.5rem; }
        .card h2 { font-size: 1.2rem; margin-bottom: 1.2rem; color: #e2e8f0; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.3rem; }
        input { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.9rem; }
        input:focus { outline: none; border-color: #38bdf8; }

        button { width: 100%; background: #0284c7; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; background: #182234; }
        .badge { background: #0369a1; color: #e0f2fe; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; }
        .btn-del { background: #ef4444; padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 4px; width: auto; }
        .btn-del:hover { background: #dc2626; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Student Records System</h1>
        <p>Lab 6A: Java Bean Architecture with JDBC MySQL Integration</p>
    </header>

    <div class="grid">
        <!-- Form -->
        <div class="card">
            <h2>Add Student Record</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="e.g. john@example.com">
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <input type="text" id="course" required placeholder="e.g. MCA / B.Tech">
                </div>
                <div class="form-group">
                    <label>GPA</label>
                    <input type="number" step="0.01" min="0" max="10" id="gpa" required placeholder="e.g. 8.5">
                </div>
                <button type="submit">Save Student (Bean &rarr; DB)</button>
            </form>
        </div>

        <!-- Table -->
        <div class="card">
            <h2>Registered Students</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>GPA</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <!-- Populated dynamically via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function loadStudents() {
        const res = await fetch('/api/students');
        const list = await res.json();
        const tbody = document.getElementById('studentTable');
        tbody.innerHTML = '';
        list.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td>#${s.studentId}</td>
                    <td>
                        <strong>${s.name}</strong><br>
                        <small style="color:#94a3b8;">${s.email}</small>
                    </td>
                    <td><span class="badge">${s.course}</span></td>
                    <td>${s.gpa}</td>
                    <td><button class="btn-del" onclick="deleteStudent(${s.studentId})">Delete</button></td>
                </tr>
            `;
        });
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            course: document.getElementById('course').value,
            gpa: parseFloat(document.getElementById('gpa').value)
        };
        await fetch('/api/students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        document.getElementById('studentForm').reset();
        loadStudents();
    });

    async function deleteStudent(id) {
        if (confirm('Delete this record?')) {
            await fetch('/api/students?id=' + id, { method: 'DELETE' });
            loadStudents();
        }
    }

    loadStudents();
</script>
</body>
</html>
